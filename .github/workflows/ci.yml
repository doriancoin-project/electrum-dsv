name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  unit-tests:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is what the released binaries bundle. protobuf is pinned <4 in
        # requirements.txt and has no wheels past 3.10, so that is the ceiling.
        python: ['3.9', '3.10']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # electrum prefers libsecp256k1 and silently falls back to python-ecdsa
      # without it; some tests exercise both paths, so install it rather than
      # testing only the fallback.
      - name: Install libsecp256k1
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsecp256k1-0

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The "tests" extra pulls in pycryptodomex, cryptography and pyaes,
          # which several tests assert are importable.
          pip install -e ".[tests]"
          pip install pytest

      # contrib/rebrand-debt-tests.txt lists the tests whose fixtures are
      # still Litecoin's -- see the header in that file. Deselecting them
      # individually (rather than skipping whole modules) keeps every passing
      # test in those modules gating master: 470 tests run here, against the
      # 132 that survive dropping the eleven affected files wholesale.
      - name: Unit tests
        run: |
          # while-read rather than mapfile: mapfile is bash 4+, and this same
          # command should be runnable on a developer's macOS bash 3.2.
          DESELECT=()
          while IFS= read -r test_id; do
            DESELECT+=("--deselect=$test_id")
          done < <(grep -v -e '^#' -e '^[[:space:]]*$' contrib/rebrand-debt-tests.txt)
          echo "deselecting ${#DESELECT[@]} known rebrand-debt tests"
          pytest electrum_ltc/tests/ -v "${DESELECT[@]}"

  rebrand-debt-ratchet:
    name: Rebrand debt (full suite)
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip

      - name: Install libsecp256k1
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsecp256k1-0

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[tests]"
          pip install pytest

      # Runs everything, Litecoin-era vectors included, and holds the failure
      # count to the size of contrib/rebrand-debt-tests.txt. A permanently red
      # job is a job nobody reads; this one is green today, goes red the moment
      # something new breaks, and tells you to prune the inventory when the
      # count drops. The number can only go down.
      - name: Full suite
        run: |
          set +e
          pytest electrum_ltc/tests/ -q 2>&1 | tee full-suite.log
          set -e

          expected=$(grep -c -v -e '^#' -e '^[[:space:]]*$' contrib/rebrand-debt-tests.txt)
          actual=$(sed -n 's/^\([0-9][0-9]*\) failed.*/\1/p' full-suite.log | tail -1)
          actual=${actual:-0}

          echo "known rebrand debt: $expected" >> "$GITHUB_STEP_SUMMARY"
          echo "failing now: $actual" >> "$GITHUB_STEP_SUMMARY"

          if [ "$actual" -gt "$expected" ]; then
            echo "::error::$actual tests failing, but only $expected are known rebrand debt."
            echo "New failures are not in contrib/rebrand-debt-tests.txt; see the log above."
            exit 1
          fi
          if [ "$actual" -lt "$expected" ]; then
            echo "::notice::Only $actual of the $expected known-failing tests still fail."
            echo "Prune the fixed ones from contrib/rebrand-debt-tests.txt."
          fi
